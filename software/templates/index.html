<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POWER BOX SOS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/static/style.css"></head><body><main class="page"><header><div><p class="eyebrow">POWER BOX</p><h1>SOS Monitoring Dashboard</h1><p class="sub">แสดงข้อมูล SOS ล่าสุดจากตัวรับ LoRa</p></div><div id="statusBadge" class="badge waiting">WAITING</div></header><section class="grid"><article class="card"><div class="sos-title">🚨 SOS ล่าสุด</div><div class="info-grid"><div><span>Device</span><strong id="device">-</strong></div><div><span>RSSI</span><strong id="rssi">-</strong></div><div><span>Latitude</span><strong id="lat">-</strong></div><div><span>Longitude</span><strong id="lon">-</strong></div><div class="wide"><span>เวลาที่เซิร์ฟเวอร์ได้รับ</span><strong id="time">-</strong></div></div><a id="mapsButton" class="button disabled" target="_blank" rel="noopener">เปิดพิกัดใน Google Maps</a></article><article class="card"><h2>แผนที่</h2><div id="map"></div><p id="mapMessage" class="muted">ยังไม่มีพิกัด GPS</p></article></section><section class="card history-card"><div class="history-head"><h2>ประวัติ SOS</h2><button onclick="loadAll()">รีเฟรช</button></div><div class="table-wrap"><table><thead><tr><th>เวลา</th><th>Device</th><th>Latitude</th><th>Longitude</th><th>RSSI</th><th>แผนที่</th></tr></thead><tbody id="historyBody"></tbody></table></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map,marker;function initMap(){map=L.map('map').setView([13.7563,100.5018],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map)}function formatTime(v){return v?new Date(v).toLocaleString('th-TH'):'-'}function setLatest(r){const b=document.getElementById('statusBadge'),mb=document.getElementById('mapsButton'),mm=document.getElementById('mapMessage');if(!r){b.textContent='WAITING';b.className='badge waiting';return}b.textContent='SOS ACTIVE';b.className='badge active';device.textContent=r.device_id??'-';rssi.textContent=r.rssi==null?'-':`${r.rssi} dBm`;lat.textContent=r.latitude==null?'WAITING GPS':Number(r.latitude).toFixed(6);lon.textContent=r.longitude==null?'WAITING GPS':Number(r.longitude).toFixed(6);time.textContent=formatTime(r.received_at);if(r.has_gps){let a=Number(r.latitude),o=Number(r.longitude);map.setView([a,o],16);if(marker)marker.setLatLng([a,o]);else marker=L.marker([a,o]).addTo(map);marker.bindPopup(`<b>${r.device_id}</b><br>SOS location`).openPopup();mb.href=`https://www.google.com/maps?q=${encodeURIComponent(a+','+o)}`;mb.classList.remove('disabled');mm.textContent=''}else{mb.removeAttribute('href');mb.classList.add('disabled');mm.textContent='ได้รับ SOS แล้ว แต่ GPS ยังไม่มีพิกัด'}}function renderHistory(rs){let body=document.getElementById('historyBody');body.innerHTML='';if(!rs.length){body.innerHTML='<tr><td colspan="6" class="empty">ยังไม่มีข้อมูล SOS</td></tr>';return}for(const r of rs){let tr=document.createElement('tr'),m=r.has_gps?`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.latitude},${r.longitude}">เปิด</a>`:'-';tr.innerHTML=`<td>${formatTime(r.received_at)}</td><td>${r.device_id}</td><td>${r.latitude==null?'-':Number(r.latitude).toFixed(6)}</td><td>${r.longitude==null?'-':Number(r.longitude).toFixed(6)}</td><td>${r.rssi??'-'}</td><td>${m}</td>`;body.appendChild(tr)}}async function loadLatest(){try{let r=await fetch('/api/latest',{cache:'no-store'}),d=await r.json();setLatest(d.record)}catch(e){console.error(e)}}async function loadHistory(){try{let r=await fetch('/api/history?limit=50',{cache:'no-store'}),d=await r.json();renderHistory(d.records??[])}catch(e){console.error(e)}}async function loadAll(){await Promise.all([loadLatest(),loadHistory()])}initMap();loadAll();setInterval(loadLatest,3000);
</script></body></html>
